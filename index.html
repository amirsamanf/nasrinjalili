<style>
/* Layout: graphite canvas; a sticky status rail (countdown + segmented progress) beside one working pane of tabs. */
:root {
  --bg: #f6f6f7;
  --surface: #ffffff;
  --surface-2: #f0f0f2;
  --surface-3: #fafafa;
  --ink: #0c0c0e;
  --ink-2: #55555e;
  --ink-3: #8b8b94;
  --line: #e4e4e8;
  --line-strong: #d2d2d8;
  --primary: #0c0c0e;
  --on-primary: #ffffff;
  --accent: #0f9488;
  --accent-ink: #0b6f66;
  --accent-soft: #e2f5f2;
  --warn: #c27803;
  --warn-soft: #fdf3dc;
  --danger: #d0254a;
  --danger-soft: #fde8ec;
  --glow: rgba(15, 148, 136, 0.10);
  --shadow: 0 1px 2px rgba(12, 12, 14, 0.04), 0 6px 24px rgba(12, 12, 14, 0.06);
  --focus: 0 0 0 3px rgba(15, 148, 136, 0.30);

  --font-display: "Geist", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-body: "Geist", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-mono: "Geist Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --font-fa: "Vazirmatn", "Segoe UI", Tahoma, sans-serif;

  --r-sm: 8px;
  --r-md: 12px;
  --r-lg: 16px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #09090b; --surface: #121214; --surface-2: #1b1b1f; --surface-3: #0f0f11;
    --ink: #f2f2f4; --ink-2: #a3a3ad; --ink-3: #6e6e78; --line: #232328; --line-strong: #303037;
    --primary: #f2f2f4; --on-primary: #09090b;
    --accent: #2dd4bf; --accent-ink: #5eead4; --accent-soft: rgba(45, 212, 191, 0.12);
    --warn: #fbbf24; --warn-soft: rgba(251, 191, 36, 0.12); --danger: #fb7185; --danger-soft: rgba(251, 113, 133, 0.12);
    --glow: rgba(45, 212, 191, 0.07);
    --shadow: 0 1px 0 rgba(255, 255, 255, 0.03) inset, 0 8px 30px rgba(0, 0, 0, 0.45);
    --focus: 0 0 0 3px rgba(45, 212, 191, 0.28);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #09090b; --surface: #121214; --surface-2: #1b1b1f; --surface-3: #0f0f11;
  --ink: #f2f2f4; --ink-2: #a3a3ad; --ink-3: #6e6e78; --line: #232328; --line-strong: #303037;
  --primary: #f2f2f4; --on-primary: #09090b;
  --accent: #2dd4bf; --accent-ink: #5eead4; --accent-soft: rgba(45, 212, 191, 0.12);
  --warn: #fbbf24; --warn-soft: rgba(251, 191, 36, 0.12); --danger: #fb7185; --danger-soft: rgba(251, 113, 133, 0.12);
  --glow: rgba(45, 212, 191, 0.07);
  --shadow: 0 1px 0 rgba(255, 255, 255, 0.03) inset, 0 8px 30px rgba(0, 0, 0, 0.45);
  --focus: 0 0 0 3px rgba(45, 212, 191, 0.28);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body {
  background: radial-gradient(1100px 420px at 50% -160px, var(--glow), transparent 70%), var(--bg);
  background-attachment: fixed;
  color: var(--ink);
  font: 400 15.5px/1.55 var(--font-body);
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}
:root[lang="fa"] body, :root[lang="fa"] input, :root[lang="fa"] textarea, :root[lang="fa"] button { font-family: var(--font-fa); }
img { max-width: 100%; }
[hidden] { display: none !important; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: none; box-shadow: var(--focus); }
a { color: var(--accent-ink); text-underline-offset: 3px; }
::selection { background: var(--accent-soft); }

/* ---------- atoms ---------- */
.display { font-family: var(--font-display); font-weight: 650; letter-spacing: -0.025em; text-wrap: balance; }
:root[lang="fa"] .display { font-family: var(--font-fa); font-weight: 800; letter-spacing: 0; }
.eyebrow { font: 500 12px/1.2 var(--font-mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-3); }
:root[lang="fa"] .eyebrow { letter-spacing: 0; font-family: var(--font-fa); font-size: 13px; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-2); }
.small { font-size: 13.5px; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 42px; padding: 0 16px; border-radius: 10px;
  border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink);
  font-weight: 550; font-size: 14.5px; transition: background .15s, border-color .15s, transform .1s, opacity .15s;
  text-decoration: none; white-space: nowrap;
}
.btn:hover { background: var(--surface-2); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
.btn.primary:hover { opacity: .88; }
.btn.accent { background: var(--accent); border-color: var(--accent); color: #04211e; }
.btn.accent:hover { opacity: .9; }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.ghost:hover { background: var(--surface-2); }
.btn.danger { color: var(--danger); }
.btn.danger.armed { background: var(--danger); color: #fff; border-color: var(--danger); }
.btn.sm { min-height: 34px; padding: 0 12px; font-size: 13.5px; border-radius: 8px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.btn svg { width: 17px; height: 17px; flex: none; }

.chip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border-radius: 999px; font-size: 12.5px; font-weight: 550; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; border: 1px solid var(--line); }
.chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.chip.ok { background: var(--accent-soft); color: var(--accent-ink); border-color: transparent; }
.chip.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.chip.bad { background: var(--danger-soft); color: var(--danger); border-color: transparent; }
.chip.plain::before { display: none; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow); }
.stack { display: flex; flex-direction: column; gap: 16px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

.logo { display: grid; place-items: center; border-radius: 30%; background: var(--primary); color: var(--accent); }
.logo svg { width: 56%; height: 56%; }

/* ---------- lock + setup ---------- */
.gate { min-height: 100vh; display: grid; place-items: center; padding-block: 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.gate-card { width: min(420px, 100%); padding: 30px 28px 22px; }
.gate-card.wide { width: min(600px, 100%); }
.gate-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 26px; }
.gate .logo { width: 56px; height: 56px; margin: 0 0 18px; box-shadow: 0 10px 30px var(--glow); }
.gate h1 { font-size: 30px; line-height: 1.1; margin: 0; }
.gate .sub { color: var(--ink-2); margin: 6px 0 24px; }
.gate-foot { margin-top: 22px; padding-top: 16px; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--ink-3); display: flex; gap: 10px; align-items: flex-start; }
.gate-foot svg { width: 16px; height: 16px; flex: none; margin-top: 1px; color: var(--accent); }
.err { color: var(--danger); background: var(--danger-soft); padding: 10px 14px; border-radius: var(--r-sm); font-size: 14px; }
.okmsg { color: var(--accent-ink); background: var(--accent-soft); padding: 10px 14px; border-radius: var(--r-sm); font-size: 14px; }

.field { display: flex; flex-direction: column; gap: 6px; }
.field > label, .field > .label { font-weight: 550; font-size: 14px; }
.field .hint { font-size: 13px; color: var(--ink-2); }
.input, textarea.input, select.input {
  width: 100%; min-height: 44px; padding: 10px 13px; border-radius: 10px;
  border: 1px solid var(--line-strong); background: var(--surface-3); color: var(--ink);
  transition: border-color .15s, background .15s, box-shadow .15s;
}
textarea.input { min-height: 110px; resize: vertical; line-height: 1.5; }
.input:hover { border-color: var(--ink-3); }
.input:focus { border-color: var(--accent); background: var(--surface); box-shadow: var(--focus); outline: none; }
.input.mono { font-family: var(--font-mono); letter-spacing: .02em; }
.pw-wrap { position: relative; }
.pw-wrap .input { padding-inline-end: 72px; }
.pw-wrap .btn { position: absolute; inset-inline-end: 5px; top: 5px; min-height: 34px; }

.steps-mini { display: flex; gap: 6px; margin: 0 0 18px; }
.steps-mini span { flex: 1; height: 4px; border-radius: 2px; background: var(--surface-2); }
.steps-mini span.on { background: var(--accent); }
.drop {
  display: block; border: 1.5px dashed var(--line-strong); border-radius: var(--r-md); padding: 22px; text-align: center; color: var(--ink-2);
  background: var(--surface-3); transition: border-color .15s, background .15s; cursor: pointer;
}
.drop.over, .slot.over { border-color: var(--accent); background: var(--accent-soft); color: var(--ink); }
.progress { height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
.progress > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .25s; }

/* ---------- app chrome ---------- */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: color-mix(in srgb, var(--bg) 80%, transparent);
  backdrop-filter: saturate(1.4) blur(14px); -webkit-backdrop-filter: saturate(1.4) blur(14px);
  border-bottom: 1px solid var(--line);
}
.topbar-in {
  max-width: 1240px; margin: 0 auto; display: flex; align-items: center; gap: 12px; min-height: 60px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.brand { display: flex; align-items: center; gap: 9px; font-weight: 650; font-size: 16px; letter-spacing: -0.01em; color: var(--ink); text-decoration: none; }
.brand .logo { width: 28px; height: 28px; }
.case-name { color: var(--ink-2); font-size: 13.5px; border-inline-start: 1px solid var(--line); padding-inline-start: 12px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.case-name b { color: var(--ink); font-weight: 550; }
.spacer { flex: 1; }
.save-chip { font-size: 12.5px; }
.seg { display: inline-flex; background: var(--surface-2); border: 1px solid var(--line); border-radius: 9px; padding: 2px; gap: 2px; }
.seg button { border: 0; background: transparent; border-radius: 7px; min-height: 28px; padding: 0 10px; font-weight: 600; font-size: 13px; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.iconbtn { width: 36px; height: 36px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; color: var(--ink-2); }
.iconbtn:hover { color: var(--ink); background: var(--surface-2); }
.iconbtn svg { width: 17px; height: 17px; }

.shell {
  max-width: 1240px; margin: 0 auto; display: grid; grid-template-columns: 312px minmax(0, 1fr); gap: 28px; align-items: start;
  padding-block: 28px 80px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.rail { position: sticky; top: calc(80px + env(safe-area-inset-top, 0px)); padding: 22px; }
.cd-num { display: flex; align-items: baseline; gap: 10px; margin: 8px 0 2px; }
.cd-num b { font: 650 64px/0.95 var(--font-display); letter-spacing: -0.05em; font-variant-numeric: tabular-nums; }
.cd-num span { color: var(--ink-2); font-size: 15px; }
:root[lang="fa"] .cd-num b { font-family: var(--font-fa); font-weight: 800; letter-spacing: 0; }
.cd-when { font-size: 14px; color: var(--ink-2); }
.cd-when b { color: var(--ink); font-weight: 600; }
.cd-when .end { color: var(--danger); font-weight: 600; }
.rail-sep { height: 1px; background: var(--line); margin: 18px 0; }
.prog-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
.prog-head .mono { font-size: 13px; color: var(--ink-2); }
.segbar { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 4px; }
.segbar button { height: 10px; padding: 0; border: 0; border-radius: 3px; background: var(--surface-2); transition: background .3s, transform .15s; }
.segbar button:hover { transform: scaleY(1.4); }
.segbar button.done { background: var(--accent); }
.segbar button.now { background: var(--warn); animation: pulse 2s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .45; } }
.segbar.intro button { animation: grow .5s cubic-bezier(.2,.8,.2,1) both; }
.segbar.intro button.now { animation: grow .5s cubic-bezier(.2,.8,.2,1) both, pulse 2s ease-in-out .6s infinite; }
@keyframes grow { from { transform: scaleX(0); opacity: 0; } }
.legend { list-style: none; margin: 14px 0 0; padding: 0; display: flex; flex-direction: column; gap: 1px; }
.legend li button { width: 100%; display: flex; align-items: center; gap: 10px; border: 0; background: transparent; padding: 6px 8px; margin-inline: -8px; border-radius: var(--r-sm); text-align: start; font-size: 14px; color: var(--ink-3); }
.legend li button:hover { background: var(--surface-2); color: var(--ink); }
.legend .dot { width: 20px; height: 20px; border-radius: 6px; display: grid; place-items: center; flex: none; font: 500 11px var(--font-mono); background: var(--surface-2); color: var(--ink-3); }
.legend .done .dot { background: var(--accent-soft); color: var(--accent-ink); }
.legend .now .dot { background: var(--warn-soft); color: var(--warn); }
.legend .done button { color: var(--ink-2); }
.legend .now button { color: var(--ink); font-weight: 600; }
.legend .dot svg { width: 12px; height: 12px; }

.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 26px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tabs button { position: relative; border: 0; background: transparent; padding: 10px 12px 13px; font-weight: 550; font-size: 14.5px; color: var(--ink-3); white-space: nowrap; display: flex; align-items: center; gap: 7px; }
.tabs button:hover { color: var(--ink); }
.tabs button[aria-selected="true"] { color: var(--ink); }
.tabs button[aria-selected="true"]::after { content: ""; position: absolute; inset-inline: 8px; bottom: -1px; height: 2px; border-radius: 2px; background: var(--ink); }
.badge { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 6px; background: var(--warn-soft); color: var(--warn); font: 500 11.5px/20px var(--font-mono); text-align: center; }
.badge.ok { background: var(--accent-soft); color: var(--accent-ink); }

.panel { animation: rise .3s ease both; }
.panel.still { animation: none; }
@keyframes rise { from { opacity: .4; transform: translateY(4px); } to { opacity: 1; transform: none; } }
.panel h2 { font-size: 30px; line-height: 1.1; margin: 0 0 6px; }
.panel .lede { color: var(--ink-2); margin: 0 0 24px; max-width: 64ch; }
.section-title { font-size: 17px; margin: 0 0 12px; }

/* overview */
.status-line { font-size: 18px; line-height: 1.5; max-width: 62ch; margin: 0 0 22px; color: var(--ink-2); }
.status-line b { color: var(--ink); font-weight: 600; }
.next-list { display: grid; gap: 8px; margin-bottom: 30px; }
.next {
  display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 14px; align-items: center; text-align: start;
  padding: 13px 14px; border-radius: var(--r-md); border: 1px solid var(--line); background: var(--surface); width: 100%; transition: border-color .15s, transform .15s;
}
.next:hover { border-color: var(--line-strong); transform: translateY(-1px); }
.next .n { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; background: var(--surface-2); color: var(--ink-2); }
.next .n svg { width: 20px; height: 20px; }
.next.first { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); box-shadow: 0 0 0 4px var(--accent-soft); }
.next.first .n { background: var(--accent); color: #04211e; }
.next .t { font-weight: 600; }
.next .d { font-size: 13.5px; color: var(--ink-2); }
.next .go { color: var(--ink-3); }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }

.profile { position: relative; overflow: hidden; padding: 22px 24px; margin-bottom: 26px; }
.profile::before { content: ""; position: absolute; inset: 0; background: radial-gradient(500px 180px at 0% 0%, var(--glow), transparent 70%); pointer-events: none; }
.profile .head { position: relative; display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; flex-wrap: wrap; }
.profile .name { font: 650 26px/1.15 var(--font-display); letter-spacing: -0.03em; margin-top: 4px; }
:root[lang="fa"] .profile .name { font-family: var(--font-fa); letter-spacing: 0; }
.profile dl { position: relative; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px 18px; margin: 20px 0 0; padding-top: 18px; border-top: 1px solid var(--line); }
.profile dt { font: 500 11.5px var(--font-mono); letter-spacing: .05em; text-transform: uppercase; color: var(--ink-3); }
:root[lang="fa"] .profile dt { font-family: var(--font-fa); letter-spacing: 0; font-size: 12.5px; }
.profile dd { margin: 3px 0 0; font-weight: 550; font-size: 14.5px; }
.fact { padding: 15px 16px; border-radius: var(--r-md); background: var(--surface); border: 1px solid var(--line); min-width: 0; }
.fact .k { font: 500 11.5px var(--font-mono); letter-spacing: .05em; text-transform: uppercase; color: var(--ink-3); }
:root[lang="fa"] .fact .k { letter-spacing: 0; font-family: var(--font-fa); font-size: 12.5px; }
.fact .v { font-size: 16px; font-weight: 600; margin-top: 6px; letter-spacing: -0.01em; }
.fact .s { font-size: 13px; color: var(--ink-2); margin-top: 2px; }
.fact.flag { border-color: color-mix(in srgb, var(--warn) 50%, var(--line)); background: var(--warn-soft); }
.log { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.log li { display: grid; grid-template-columns: 170px minmax(0, 1fr); gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.log li .at { color: var(--ink-3); font-family: var(--font-mono); font-size: 12.5px; padding-top: 2px; }

/* gaps */
.gaps { display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: 22px; align-items: start; }
.gap-list { display: flex; flex-direction: column; gap: 2px; position: sticky; top: 140px; }
.gap-list button { display: flex; align-items: center; gap: 10px; border: 1px solid transparent; background: transparent; padding: 8px 10px; border-radius: 9px; text-align: start; color: var(--ink-2); font-weight: 500; font-size: 14px; }
.gap-list button:hover { background: var(--surface-2); color: var(--ink); }
.gap-list button[aria-current="true"] { background: var(--surface); border-color: var(--line); color: var(--ink); font-weight: 600; box-shadow: var(--shadow); }
.gap-list .st { width: 18px; height: 18px; border-radius: 50%; flex: none; display: grid; place-items: center; border: 1.5px solid var(--line-strong); }
.gap-list .st.done { background: var(--accent); border-color: var(--accent); color: #04211e; }
.gap-list .st.part { border-color: var(--warn); background: conic-gradient(var(--warn) var(--p), transparent 0); }
.gap-list .st svg { width: 11px; height: 11px; }
.qcard { padding: 26px 26px 22px; }
.qcard h3 { font-size: 24px; margin: 4px 0 4px; }
.qcard .intro { color: var(--ink-2); margin: 0 0 22px; max-width: 62ch; }
.qfields { display: flex; flex-direction: column; gap: 22px; }
.q { display: flex; flex-direction: column; gap: 9px; padding-bottom: 22px; border-bottom: 1px solid var(--line); }
.q:last-child { border-bottom: 0; padding-bottom: 0; }
.q .qlabel { font-weight: 550; font-size: 15.5px; line-height: 1.45; }

.q .hint svg { width: 15px; height: 15px; flex: none; margin-top: 3px; color: var(--warn); }
.choices { display: flex; flex-wrap: wrap; gap: 6px; }
.choices button { min-height: 40px; padding: 0 16px; border-radius: 10px; border: 1px solid var(--line-strong); background: var(--surface); font-weight: 550; font-size: 14.5px; color: var(--ink-2); transition: background .15s, color .15s, border-color .15s; }
.choices button:hover { border-color: var(--ink-3); color: var(--ink); }
.choices button[aria-pressed="true"] { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
.choices button.yes[aria-pressed="true"] { background: var(--warn); border-color: var(--warn); color: #1d1300; }
.choices button.unsure[aria-pressed="true"] { background: var(--surface-2); border-color: var(--ink-3); color: var(--ink); }
.date-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.date-row .input { width: auto; min-width: 180px; flex: 0 1 210px; }
.jal { font-size: 13px; color: var(--ink-2); font-family: var(--font-fa); direction: rtl; text-align: start; }
.jal-entry { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; padding: 10px; border-radius: var(--r-md); background: var(--surface-2); direction: rtl; font-family: var(--font-fa); }
.jal-entry .input { width: 86px; min-height: 38px; padding: 6px 10px; text-align: center; }
.unsure-tog { display: inline-flex; gap: 7px; align-items: center; font-size: 13.5px; color: var(--ink-2); cursor: pointer; user-select: none; }
.unsure-tog input { width: 16px; height: 16px; accent-color: var(--warn); }
.q-foot { display: flex; justify-content: space-between; gap: 10px; margin-top: 24px; flex-wrap: wrap; }
.work-row { display: grid; grid-template-columns: 120px 120px minmax(0, 1.2fr) minmax(0, 1fr) minmax(0, .9fr) minmax(0, .8fr) 36px; gap: 8px; align-items: end; padding: 10px; border-radius: var(--r-md); background: var(--surface-3); border: 1px solid var(--line); }
.work-row label { font-size: 12px; color: var(--ink-3); font-weight: 550; display: block; margin-bottom: 4px; }
.work-row .input { min-height: 38px; padding: 7px 9px; font-size: 14px; }
.work-row .present { display: flex; gap: 5px; align-items: center; font-size: 12.5px; color: var(--ink-2); margin-top: 4px; }
.coverage { margin: 2px 0 8px; }
.coverage .bar { position: relative; height: 8px; border-radius: 4px; background: var(--danger-soft); overflow: hidden; direction: ltr; }
.coverage .bar i { position: absolute; top: 0; bottom: 0; background: var(--accent); }
.coverage .lbls { display: flex; justify-content: space-between; font: 500 11.5px var(--font-mono); color: var(--ink-3); margin-top: 5px; direction: ltr; }
.qs-chips { display: flex; gap: 6px; flex-wrap: wrap; }
.qs-chips button { border: 1px dashed var(--line-strong); background: transparent; border-radius: 8px; padding: 5px 11px; font-size: 13px; color: var(--ink-2); }
.qs-chips button:hover { border-style: solid; color: var(--ink); }
.id-row { display: flex; gap: 8px; }
.id-row .input { flex: 1; }

/* documents */
.docs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.slot { padding: 18px; display: flex; flex-direction: column; gap: 12px; min-width: 0; transition: border-color .15s, background .15s; }
.slot.req-missing { border-color: color-mix(in srgb, var(--warn) 45%, var(--line)); }
.slot.wide { grid-column: 1 / -1; }
.slot-head { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.slot-head h4 { margin: 0; font-size: 16px; font-weight: 600; letter-spacing: -0.01em; }
.slot-head p { margin: 3px 0 0; font-size: 13.5px; color: var(--ink-2); }
.thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; }
.thumb { position: relative; border-radius: 10px; overflow: hidden; border: 1px solid var(--line); background: var(--surface-2); aspect-ratio: 3 / 4; display: flex; flex-direction: column; text-align: start; padding: 0; transition: border-color .15s, transform .15s; }
.thumb .img { flex: 1; min-height: 0; display: grid; place-items: center; overflow: hidden; color: var(--ink-3); }
.thumb .img img { width: 100%; height: 100%; object-fit: cover; }
.thumb .img svg { width: 30px; height: 30px; }
.thumb .cap { font-size: 11.5px; padding: 5px 7px; background: var(--surface); border-top: 1px solid var(--line); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.thumb .pg { position: absolute; top: 6px; inset-inline-start: 6px; background: var(--primary); color: var(--on-primary); font: 500 11px var(--font-mono); padding: 1px 6px; border-radius: 5px; }
.thumb:hover { border-color: var(--line-strong); transform: translateY(-1px); }
.slot-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.check-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; font-size: 13.5px; }
.check-list li { display: flex; gap: 8px; align-items: center; }
.check-list svg { width: 15px; height: 15px; flex: none; }
.check-list .ok { color: var(--accent); } .check-list .no { color: var(--danger); }
.photo-frame { position: relative; width: 116px; aspect-ratio: 35 / 45; border-radius: 8px; overflow: hidden; background: var(--surface-2); flex: none; }
.photo-frame img { width: 100%; height: 100%; object-fit: cover; }
.photo-frame::after { content: ""; position: absolute; left: 22%; right: 22%; top: 9%; height: 72%; border: 1.5px dashed rgba(255,255,255,.9); border-radius: 50% 50% 46% 46%; box-shadow: 0 0 0 1px rgba(0,0,0,.25); }
.result-row { display: flex; gap: 12px; align-items: center; padding: 10px 12px; border-radius: var(--r-md); background: var(--accent-soft); }
.result-row svg { width: 20px; height: 20px; color: var(--accent-ink); flex: none; }
.result-row .grow { flex: 1; min-width: 0; }

/* notes */
.composer { padding: 18px; }
.notes { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
.note { padding: 14px 16px; border-radius: var(--r-md); border: 1px solid var(--line); background: var(--surface); }
.note.claude { border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); background: color-mix(in srgb, var(--accent) 5%, var(--surface)); }
.note .meta { display: flex; gap: 10px; align-items: center; font-size: 12.5px; color: var(--ink-3); margin-bottom: 6px; flex-wrap: wrap; }
.note .body { white-space: pre-wrap; overflow-wrap: anywhere; }
.paste-hint { display: flex; gap: 10px; align-items: center; padding: 11px 14px; border-radius: var(--r-md); background: var(--surface-2); font-size: 13.5px; color: var(--ink-2); margin-bottom: 14px; }
.paste-hint svg { width: 16px; height: 16px; flex: none; }
.paste-hint kbd { font: 500 12px var(--font-mono); padding: 1px 6px; border-radius: 5px; background: var(--surface); border: 1px solid var(--line-strong); }

/* submit */
.checklist { display: flex; flex-direction: column; gap: 6px; }
.ck { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 12px; align-items: start; padding: 13px 15px; border-radius: var(--r-md); border: 1px solid var(--line); background: var(--surface); cursor: pointer; }
.ck input { width: 18px; height: 18px; margin-top: 3px; accent-color: var(--accent); }
.ck .t { font-weight: 600; }
.ck .d { font-size: 13.5px; color: var(--ink-2); }
.ck.done { background: var(--surface-3); }
.ck.done .t { text-decoration: line-through; text-decoration-color: var(--ink-3); color: var(--ink-2); }
.ck.auto { cursor: default; }
.split { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 20px; align-items: start; }
.box { padding: 20px; }
.box h3 { margin: 0 0 8px; font-size: 17px; }

/* toasts + modal */
#toasts { position: fixed; inset-inline-end: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 60; display: flex; flex-direction: column; gap: 8px; width: min(360px, calc(100vw - 32px)); }
.toast { background: var(--primary); color: var(--on-primary); padding: 12px 14px; border-radius: var(--r-md); box-shadow: 0 10px 30px rgba(0,0,0,.25); font-size: 14px; display: flex; flex-direction: column; gap: 8px; animation: rise .25s ease both; }
.toast.bad { background: var(--danger); color: #fff; }
.toast .progress { background: color-mix(in srgb, var(--on-primary) 20%, transparent); height: 4px; }
.modal-back { position: fixed; inset: 0; z-index: 50; background: rgba(0, 0, 0, .6); backdrop-filter: blur(4px); display: grid; place-items: center; padding: 20px; }
.modal { width: min(960px, 100%); max-height: calc(100vh - 40px); display: flex; flex-direction: column; overflow: hidden; }
.modal-head { display: flex; gap: 10px; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.modal-head .ttl { flex: 1; min-width: 0; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.modal-body { flex: 1; min-height: 0; overflow: auto; background: var(--surface-3); display: grid; place-items: center; }
.modal-body img { max-height: calc(100vh - 140px); object-fit: contain; }
.modal-body iframe { width: 100%; height: calc(100vh - 140px); border: 0; background: #fff; }

.test-banner { background: var(--warn-soft); color: var(--warn); text-align: center; font-size: 12.5px; font-weight: 600; padding: 5px 16px; }

/* ---------- responsive ---------- */
@media (max-width: 1080px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .rail { position: static; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr); gap: 0 28px; align-items: start; }
  .rail .rail-sep { display: none; }
  .gaps { grid-template-columns: minmax(0, 1fr); }
  .gap-list { position: static; flex-direction: row; overflow-x: auto; padding-bottom: 4px; }
  .gap-list button { white-space: nowrap; }
  .work-row { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .work-row .rm { grid-column: 2; justify-self: end; }
}
@media (max-width: 720px) {
  .case-name { display: none; }
  .grid2, .grid3, .docs, .split { grid-template-columns: minmax(0, 1fr); }
  .profile dl { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .panel h2 { font-size: 26px; }
  .rail { grid-template-columns: minmax(0, 1fr); padding: 18px; }
  .rail .legend { display: none; }
  .rail .prog { margin-top: 16px; }
  .cd-num b { font-size: 52px; }
  .log li { grid-template-columns: minmax(0, 1fr); gap: 0; }
  .qcard { padding: 20px 16px; }
  .topbar-in { gap: 8px; }
  .save-chip span.txt { display: none; }
  .tabs { position: sticky; top: calc(60px + env(safe-area-inset-top, 0px)); z-index: 10; background: var(--bg); margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); padding-inline: max(10px, env(safe-area-inset-left, 0px)); }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
